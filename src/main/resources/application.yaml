spring:
  application:
    name: sos
  data:
    mongodb:
      uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT:27017}/filestorage?authSource=admin
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: 8088
  base-url: ${SERVER_BASE_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://farm-automation.alves-dev.com}

storage:
  root-path: ${STORAGE_ROOT_PATH}
  max-file-size: 52428800   # 50MB in bytes
  allowed-buckets-regex: "^[a-zA-Z0-9_-]+$"
  allowed-filename-regex: "^[a-zA-Z0-9._-]+$"
  max-bucket-name-length: 50

temporary-url:
  signing-secret: ${TEMPORARY_URL_SIGNING_SECRET}
  min-duration: 5m
  max-duration: 30d

content-cache:
  enabled: ${CACHE_ENABLED:false}
  host: ${CACHE_HOST:localhost}
  port: ${CACHE_PORT:6379}
  max-file-size: 5MB
  ttl: 6h
  timeout: 200ms

file-access:
  flush-interval: 1m
  recent-window-days: 30

storage-integrity:
  enabled: ${STORAGE_INTEGRITY_ENABLED:true}
  cron: 0 0 3 * * *
  zone: America/Sao_Paulo
  batch-size: 100
  recheck-days: 10
  workers: 4
  max-items-per-run: 5000
